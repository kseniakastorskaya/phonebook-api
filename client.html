<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Телефонный справочник</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    input { padding: 5px; margin: 3px; }
    button { padding: 5px 10px; margin: 3px; cursor: pointer; }
    .form { margin: 15px 0; padding: 10px; background: #f7f7f7; }
  </style>
</head>
<body>
  <h1>Телефонный справочник</h1>

  <div class="form">
    <h3 id="form-title">Добавить контакт</h3>
    <input type="hidden" id="edit-id">
    <input type="text" id="username" placeholder="Имя" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="mobile" placeholder="Мобильный" required>
    <input type="text" id="home" placeholder="Домашний" required>
    <button onclick="saveContact()">Сохранить</button>
    <button onclick="resetForm()">Отмена</button>
  </div>

  <button onclick="loadContacts()">Обновить список</button>

  <table id="contacts-table">
    <thead>
      <tr>
        <th>ID</th><th>Имя</th><th>Email</th><th>Мобильный</th><th>Домашний</th><th>Действия</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API = "http://localhost:8080/api/contacts";

    async function loadContacts() {
      const res = await fetch(API);
      const list = await res.json();
      const tbody = document.querySelector("#contacts-table tbody");
      tbody.innerHTML = "";
      list.forEach(c => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${c._id}</td>
          <td>${c.username}</td>
          <td>${c.email}</td>
          <td>${c.telephone?.mobile || ""}</td>
          <td>${c.telephone?.home || ""}</td>
          <td>
            <button onclick="editContact('${c._id}')">Изменить</button>
            <button onclick="deleteContact('${c._id}')">Удалить</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function saveContact() {
      const id = document.getElementById("edit-id").value;
      const body = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        telephone: {
          mobile: document.getElementById("mobile").value,
          home: document.getElementById("home").value
        }
      };
      const url = id ? `${API}/${id}` : API;
      const method = id ? "PUT" : "POST";
      await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      resetForm();
      loadContacts();
    }

    async function editContact(id) {
      const res = await fetch(`${API}/${id}`);
      const c = await res.json();
      document.getElementById("edit-id").value = c._id;
      document.getElementById("username").value = c.username;
      document.getElementById("email").value = c.email;
      document.getElementById("mobile").value = c.telephone?.mobile || "";
      document.getElementById("home").value = c.telephone?.home || "";
      document.getElementById("form-title").textContent = "Редактировать контакт";
    }

    async function deleteContact(id) {
      if (!confirm("Удалить контакт?")) return;
      await fetch(`${API}/${id}`, { method: "DELETE" });
      loadContacts();
    }

    function resetForm() {
      document.getElementById("edit-id").value = "";
      document.getElementById("username").value = "";
      document.getElementById("email").value = "";
      document.getElementById("mobile").value = "";
      document.getElementById("home").value = "";
      document.getElementById("form-title").textContent = "Добавить контакт";
    }

    loadContacts();
  </script>
</body>
</html>
